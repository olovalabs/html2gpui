[package]
name = "app"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
gpui = "0.2.2"
gpui-component = { version = "0.5.1", features = ["tree-sitter-languages"] }
gpui-component-assets = "0.5.1"
rust-embed = "8.12.0"
serde_json = "1"
rfd = "0.15"
lsp-types = "0.97.0"
url = "2"
async-channel = "2"
portable-pty = "0.8"
notify = "7"
alacritty_terminal = "0.24"
gpui-terminal = "0.1.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
