<script>
  let auto_save = true;
  let notifications = true;
  let cache_mode = "In-Memory";
  let sync_status = "Synced";

  function toggleAutoSave() {
    auto_save = !auto_save;
  }

  function toggleNotifications() {
    notifications = !notifications;
  }

  function clearAppCache() {
    sync_status = "Cache Purged";
  }
</script>

<div class="settings-box">
  <div class="head-box">
    <h2>Settings</h2>
    <p class="head-sub">Manage your preferences and workspace configuration.</p>
  </div>

  <div class="setting-item">
    <div class="setting-info">
      <h4>Auto-Save Changes</h4>
      <p class="item-desc">Automatically persist state on component mutation</p>
    </div>
    <button class="btn btn-toggle" onclick={toggleAutoSave}>{auto_save}</button>
  </div>

  <div class="setting-item">
    <div class="setting-info">
      <h4>Desktop Notifications</h4>
      <p class="item-desc">Show toast notifications on compilation events</p>
    </div>
    <button class="btn btn-toggle" onclick={toggleNotifications}>{notifications}</button>
  </div>

  <div class="setting-item">
    <div class="setting-info">
      <h4>Cache Engine: {cache_mode}</h4>
      <p class="item-desc">Current state: {sync_status}</p>
    </div>
    <button class="btn btn-danger" onclick={clearAppCache}>Purge Cache</button>
  </div>
</div>
